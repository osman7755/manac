<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>manac</title>
<meta name="description" content="Задачи, календарь, заметки, цели и финансы в одном месте" />
<meta name="application-name" content="manac" />
<meta name="apple-mobile-web-app-title" content="manac" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0e0e10" />
<meta name="format-detection" content="telephone=no" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0e0e10; }
  body { overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
  #root { box-sizing: border-box; min-height: 100%; }
  @media (max-width: 900px) {
    html, body { overflow: hidden; }
    /* строка состояния iPhone поверх приложения — отодвигаем содержимое */
    #root { height: 100%; padding-top: env(safe-area-inset-top, 0px); }
  }
  .boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  .boot i { width: 12px; height: 12px; border-radius: 50%; background: #3e82f7; box-shadow: 0 0 24px #3e82f7; animation: p 1.2s ease-in-out infinite; }
  @keyframes p { 50% { transform: scale(0.6); opacity: 0.5; } }
</style>
</head>
<body>
<div id="root"><div class="boot"><i></i></div></div>
<noscript>Для работы manac нужен JavaScript.</noscript>
<script src="app.1f2ce29f86.js"></script>
<!-- manac 1.3.0 -->
</body>
</html>
